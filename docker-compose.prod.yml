# Production stack (database is external: Supabase). Usage:
#   cp .env.production.example .env.production   # then set the real password
#   pnpm prod:up
name: flag-football-prod

services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
    restart: "no"

  app:
    build:
      context: .
      target: runner
    container_name: flag-football-app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env.production}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

# Supabase's direct host is IPv6-only. Docker's default bridge is IPv4, so give
# this stack a ULA subnet; the daemon masquerades it out through the host's IPv6.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.210.0/24
          gateway: 172.28.210.1
        - subnet: fd12:3456:789a:1::/64
          gateway: fd12:3456:789a:1::1
