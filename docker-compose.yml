services:
  db:
    image: postgres:16-alpine
    container_name: flag-football-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flag
      POSTGRES_PASSWORD: flag
      POSTGRES_DB: flagfootball
    ports:
      - "5432:5432"
    volumes:
      - flag_football_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flag -d flagfootball"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flag_football_pgdata:
